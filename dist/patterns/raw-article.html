<script>document.addEventListener('DOMContentLoaded', () => render("---\ndescription: The process of preparing for coding interviews is anxiety-inducing for many developers. There\u2019s\u00a0so much\u00a0material\u00a0to cover, and often much of it feels\u00a0irrelevant\u00a0to what devs are doing in their day jobs, which only adds to the stress.\ntitle: 14 Patterns to Ace Any Coding Interview Question | HackerNoon\n---\n\n1,647,398 reads\n\n# 14 Patterns to Ace Any Coding Interview Question\n\nby\n\n[**Fahim ul Haq**](https://hackernoon.com/u/fahimulhaq)\n\n[![Fahim ul Haq](https://hackernoon.imgix.net/images/avatars/G9YRlqC9joZNTWsi1ul7tRkO6tv1.jpg?auto=format%2Ccompress&w=96)byFahim ul Haq|@ fahimulhaq](https://hackernoon.com/u/fahimulhaq)\n\nEx-Microsoft, Ex-Facebook. Co-founder at Educative.io\n\nSubscribe\n\n[May 29th, 2019](https://hackernoon.com/archives/2019/05/29)\n\n![Read on Terminal Reader](https://hackernoon.imgix.net/computer.png?auto=format%2Ccompress&w=48)![Print this story](https://hackernoon.imgix.net/images/Print%20Icon%20%4025px.png?auto=format%2Ccompress&w=48)![Read this story w/o Javascript](https://hackernoon.imgix.net/images/Lite%20Icon%20%4025px.png?auto=format%2Ccompress&w=48)\n\nTLDR\n\n![Read on Terminal Reader](https://hackernoon.imgix.net/computer.png?auto=format%2Ccompress&w=48)![Print this story](https://hackernoon.imgix.net/images/Print%20Icon%20%4025px.png?auto=format%2Ccompress&w=48)![Read this story w/o Javascript](https://hackernoon.imgix.net/images/Lite%20Icon%20%4025px.png?auto=format%2Ccompress&w=48)\n\nTranslations\n\n- [![en-flag](https://hackernoon.imgix.net/images/usa_flag.webp?auto=format%2Ccompress&w=48)EN](https://hackernoon.com/14-patterns-to-ace-any-coding-interview-question-c5bb3357f6ed)\n- [![es-flag](https://hackernoon.imgix.net/images/spain_flag.webp?auto=format%2Ccompress&w=48)ES](https://hackernoon.com/lang/es/14-patterns-to-ace-any-coding-interview-question-c5bb3357f6ed)\n\n[![en-flag](https://hackernoon.imgix.net/images/usa_flag.webp?auto=format%2Ccompress&w=48)EN](https://hackernoon.com/14-patterns-to-ace-any-coding-interview-question-c5bb3357f6ed) [![es-flag](https://hackernoon.imgix.net/images/spain_flag.webp?auto=format%2Ccompress&w=48)ES](https://hackernoon.com/lang/es/14-patterns-to-ace-any-coding-interview-question-c5bb3357f6ed)\n\n[\u2018 interview with a computer developer \u2019](https://hackernoon.com/gallery/interview-with-a-computer-developer-clgnf08id000001s698o4eedu) by [HackerNoon AI Image Generator](https://hackernoon.com/gallery)\n\n![featured image - 14 Patterns to Ace Any Coding Interview Question](https://hackernoon.imgix.net/images/interview-with-a-computer-developer-clgnf08id000001s698o4eedu.png?auto=format%2Ccompress&w=3840)\n\nYour browser does not support the `audio` element.\n\nSpeed1x\n\nVoice\n\nDr. One ![Dr. One (en-US)](https://hackernoon.imgix.net/avatars/robot-b5.png)Ms. Hacker ![Ms. Hacker (en-US)](https://hackernoon.imgix.net/avatars/robot-b6.png)Madam Beckham ![Madam Beckham (en-GB)](https://hackernoon.imgix.net/avatars/robot-b2.png)Ali Mohat ![Ali Mohat (en-IN)](https://hackernoon.imgix.net/avatars/robot-b4.png)\n\n![Fahim ul Haq](https://hackernoon.imgix.net/images/avatars/G9YRlqC9joZNTWsi1ul7tRkO6tv1.jpg?auto=format%2Ccompress&w=96)\n\nbyFahim ul Haq@ fahimulhaq\n\n[![Fahim ul Haq](https://hackernoon.imgix.net/images/avatars/G9YRlqC9joZNTWsi1ul7tRkO6tv1.jpg?auto=format%2Ccompress&w=96)byFahim ul Haq|@ fahimulhaq](https://hackernoon.com/u/fahimulhaq)\n\nEx-Microsoft, Ex-Facebook. Co-founder at Educative.io\n\nSubscribe\n\nStory's Credibility\n\n![Guide](https://hackernoon.imgix.net/images/img-5p03rto.png?auto=format%2Ccompress&w=32)\n\n![Fahim ul Haq](https://hackernoon.imgix.net/images/avatars/G9YRlqC9joZNTWsi1ul7tRkO6tv1.jpg?auto=format%2Ccompress&w=3840)\n\n[![Fahim ul Haq](https://hackernoon.imgix.net/images/avatars/G9YRlqC9joZNTWsi1ul7tRkO6tv1.jpg?auto=format%2Ccompress&w=96)byFahim ul Haq|@ fahimulhaq](https://hackernoon.com/u/fahimulhaq)\n\nEx-Microsoft, Ex-Facebook. Co-founder at Educative.io\n\nSubscribe\n\nStory's Credibility\n\n![Guide](https://hackernoon.imgix.net/images/img-5p03rto.png?auto=format%2Ccompress&w=32)\n\nThe process of preparing for coding interviews is anxiety-inducing for many developers. There\u2019s\u00a0*so much*\u00a0material\u00a0to cover, and often much of it feels\u00a0irrelevant\u00a0to what devs are doing in their day jobs, which only adds to the stress.\n\nOne of the outcomes of this is that it\u2019s now common for developers to spend weeks combing through hundreds of interview questions on sites like\u00a0LeetCode. One of the most common points of anxiety developers that I\u2019ve talked to have before the interview is:\u00a0*Have I solved enough practice questions? Could I have done more?*\n\nThat\u2019s\u00a0why\u00a0I try to focus on helping\u00a0developers\u00a0grasp the\u00a0underlying *patterns\u00a0*behind each\u00a0question\u00a0\u2014 so they don\u2019t have to worry about solving hundreds of problems and suffer from Leetcode fatigue.\u00a0If you understand the generic patterns, you can\u00a0use them as a template to solve a myriad of other problems with slight variations.\n\nHere,\u00a0I\u2019ve laid out the top 14 patterns that can be used to solve any coding interview question,\u00a0as well as how to identify each pattern, and some example questions for each. This just touches the surface \u2014 I\u00a0strongly recommend checking out [**Grokking Coding Interview Patterns in Java**](https://www.educative.io/courses/grokking-coding-interview-patterns-java?ref=hackernoon.com)**\u00a0**for comprehensive explanations, examples, and coding practice.\n\nThe following patterns assume that you\u2019ve brushed up on Data Structures. If you haven\u2019t, check out this\u00a0 [**refresher course on Data Structures**](https://www.educative.io/courses/ds-and-algorithms-in-python?ref=hackernoon.com).\n\nLet\u2019s get started!\n\n  \n\n**1. Sliding Window**\n\nThe Sliding Window pattern is\u00a0used to perform a required operation on a specific window size of a given array or linked list, such as finding the longest subarray containing all 1s.\u00a0Sliding Windows start from the 1st element and keep shifting right by one element and adjust the length of the window according to the\u00a0problem\u00a0that you are solving. In some cases, the window size remains constant and in other cases the sizes grows or shrinks.\n\n![Fahim ul Haq's image-e775e8](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-8i6d3wi0.jpg?auto=format%2Ccompress&w=1920)\n\n**Following\u00a0are some ways you can identify that the given problem might require a sliding window**:\n\n- The problem\u00a0input is a linear data structure such as a linked list, array, or string\n- You\u2019re\u00a0asked to find the longest/shortest\u00a0substring, subarray, or a desired value\n\nCommon problems you use the sliding window pattern with:\n\n- Maximum\u00a0sum\u00a0subarray of size \u2018K\u2019\u00a0(easy)\n- Longest substring\u00a0with \u2018K\u2019\u00a0distinct\u00a0characters (medium)\n- String anagrams (hard)\n\n**2. Two Pointers or Iterators**\n\nTwo Pointers is\u00a0a pattern where two pointers iterate through the data structure in tandem until one or both of the pointers hit a certain condition.Two Pointers is often useful when searching pairs in a sorted array or linked list; for example, when you have to compare each element of an array to its other elements.\n\nTwo pointers are needed because with just pointer, you would have to continually loop back through the array to find the answer. This back and forth\u00a0with a single iterator is inefficient for time and space complexity \u2014 a concept referred to as asymptotic analysis.\u00a0While the brute force or naive solution with 1 pointer would work, it will\u00a0produce something along the lines of O(n\u00b2). In many cases, two pointers can help you find a solution with better space or\u00a0runtime complexity.\n\n![Fahim ul Haq's image-bd2768](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-x4da3w5y.jpg?auto=format%2Ccompress&w=1920)\n\n  \n\nWays to identify when to use the Two Pointer method:\n\n- It will feature problems where you deal with sorted arrays (or Linked Lists) and need to find a set of elements that fulfill certain constraints\n- The set of elements in the array is a pair, a triplet, or even a subarray\n\nHere are some problems that\u00a0feature\u00a0the Two Pointer pattern:\n\n- Squaring a sorted array (easy)\n- Triplets that sum to zero (medium)\n- Comparing strings that contain backspaces (medium)\n\n**3. Fast and Slow pointers  \n**The Fast and Slow pointer approach, also known as the\u00a0**Hare & Tortoise algorithm**, is a pointer algorithm that uses two pointers which move through the array (or sequence/linked list)\u00a0at different speeds.\u00a0**This approach is quite useful when dealing with cyclic linked lists or arrays.**\n\nBy moving at different speeds (say, in a cyclic linked list), the algorithm proves that the two pointers are bound to meet. The fast pointer should catch the slow pointer once both the pointers are in a cyclic loop.\n\n![Fahim ul Haq's image-5501f](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-suft3wtu.jpg?auto=format%2Ccompress&w=1920)\n\n  \n\nHow do you identify when to use the Fast and Slow pattern?\n\n- The problem will deal with a loop in a linked list or array\n- When you need to know the position of a certain element or the overall length of the linked list.\n\nWhen should I use it over the Two Pointer method mentioned above?\n\n- There are some cases where you shouldn\u2019t use the Two Pointer approach such as in a singly linked list where you can\u2019t move in a backwards direction. An example of when to use the Fast and Slow pattern is when you\u2019re trying to determine if a linked list is a palindrome.\n\nProblems featuring the fast and slow pointers pattern:\n\n- Linked List Cycle (easy)\n- Palindrome Linked List\u00a0(medium)\n- Cycle in a Circular Array\u00a0(hard)\n\n**4. Merge Intervals**\n\nThe Merge Intervals pattern is an efficient technique to deal with overlapping\u00a0intervals. In a lot of problems involving intervals, you either need to find overlapping intervals or merge intervals if they overlap. The pattern works like this:\n\nGiven two intervals (\u2018a\u2019 and \u2018b\u2019), there will be six different ways the two intervals can relate to each other:\n\n![Fahim ul Haq's image-8a7a5](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-8mh13wm9.jpg?auto=format%2Ccompress&w=1920)\n\nUnderstanding and recognizing these six cases will help you help you solve a wide range of problems from inserting intervals to optimizing interval merges.\n\nHow do you identify when to use the Merge Intervals pattern?\n\n- If you\u2019re asked to produce a list with only mutually exclusive intervals\n- If you hear the term \u201coverlapping intervals\u201d.\n\nMerge interval problem patterns:\n\n- Intervals Intersection (medium)\n- Maximum CPU Load (hard)\n\n**5. Cyclic sort**\n\nThis pattern describes an interesting approach to deal with problems involving arrays containing numbers in a given range.\u00a0The Cyclic Sort pattern iterates over the array one number at a time, and if the current number you are iterating is not at the correct index, you swap it with the number at its correct index.\u00a0You could try placing the number in its correct index, but this will produce a complexity of O(n^2) which is not optimal, hence the Cyclic Sort pattern.\n\n![Fahim ul Haq's image-67bb9](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-t8i13wdp.jpg?auto=format%2Ccompress&w=1920)\n\nHow do I identify this pattern?\n\n- They will be problems involving a sorted array with numbers in a given range\n- If the problem asks you to find the missing/duplicate/smallest number in an sorted/rotated array\n\nProblems featuring cyclic sort pattern:\n\n- Find the Missing Number (easy)\n- Find the Smallest Missing Positive Number\u00a0(medium)\n\n**6. In-place reversal of linked list**\n\nIn a lot of problems, you may be asked to reverse the links between a set of nodes of a linked list. Often, the constraint is that you need to do this in-place, i.e., using the existing node objects and without using extra memory. This is where the above mentioned pattern is useful.\n\nThis pattern reverses one node at a time starting with one variable (current) pointing to the head of the linked list, and one variable (previous) will point to the previous node that you have processed. In a lock-step manner, you will reverse the current node by pointing it to the previous before moving on to the next node. Also, you will update the variable \u201cprevious\u201d to always point to the previous node that you have processed.\n\n![Fahim ul Haq's image-949a3](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-gekl3wfd.jpg?auto=format%2Ccompress&w=3840)\n\nHow do I identify when to use this pattern:\n\n- If you\u2019re asked to reverse a linked list without using extra memory\n\nProblems featuring in-place reversal of linked list pattern:\n\n- Reverse a Sub-list (medium)\n- Reverse every K-element Sub-list (medium)\n\n**7. Tree BFS**\n\nThis pattern is based on the Breadth First Search (BFS) technique to traverse a tree and uses a queue to keep track of all the nodes of a level before jumping onto the next level. Any problem involving the traversal of a tree in a level-by-level order can be efficiently solved using this approach.\n\nThe Tree BFS pattern works by pushing the root node to the queue and then continually iterating until the queue is empty. For each iteration, we remove the node at the head of the queue and \u201cvisit\u201d that node. After removing each node from the queue, we also insert all of its children into the queue.\n\nHow to identify the Tree BFS pattern:\n\n- If you\u2019re asked to traverse a tree in a level-by-level fashion (or level order traversal)\n\nProblems featuring Tree BFS pattern:\n\n- Binary Tree Level Order Traversal (easy)\n\n- Zigzag Traversal (medium)\n\n**8. Tree DFS**\n\nTree DFS is based on the Depth First Search (DFS) technique to traverse a tree.\n\nYou can use recursion (or a stack for the iterative approach) to keep track of all the previous (parent) nodes while traversing.\n\nThe Tree DFS pattern works by starting at the root of the tree, if the node is not a leaf you need to do three things:\n\n1. Decide whether to process the current node now (pre-order), or between processing two children (in-order) or after processing both children (post-order).\n2. Make two recursive calls for both the children of the current node to process them.\n\nHow to identify the Tree DFS pattern:\n\n- If you\u2019re asked to traverse a tree with in-order, preorder, or postorder DFS\n- If the problem requires searching for something where the node is closer to a leaf\n\nProblems featuring Tree DFS pattern:\n\n- Sum of Path Numbers (medium)\n- All Paths for a Sum\u00a0(medium)\n\n**9. Two heaps**\n\nIn many problems, we are given a set of elements such that we can divide them into two parts. To solve the problem, we are interested in knowing the smallest element in one part and the biggest element in the other part. This pattern is an efficient approach to solve such problems.\n\nThis pattern uses two heaps; A Min Heap to find the smallest element and a Max Heap to find the biggest element. The pattern works by storing the first half of numbers in a Max Heap, this is because you want to find the largest number in the first half. You then store the second half of numbers in a Min Heap, as you want to find the smallest number in the second half.\u00a0At any time, the median of the current list of numbers can be calculated from the top element of the two heaps.\n\nWays to identify the Two Heaps pattern:\n\n- Useful in situations like Priority Queue, Scheduling\n- If the problem states that you need to find the smallest/largest/median elements of a set\n- Sometimes, useful in problems featuring a binary tree data structure\n\nProblems featuring\n\n- Find the Median of a Number Stream (medium)\n\n**10. Subsets**\n\nA huge number of coding interview problems involve dealing with Permutations and Combinations of a given set of elements. The pattern Subsets describes an efficient Breadth First Search (BFS) approach to handle all these problems.\n\nThe pattern looks like this:\n\nGiven a set of \\[1, 5, 3]\n\n1. Start with an empty set: \\[\\[]]\n2. Add the first number (1) to all the existing subsets to create new subsets: \\[\\[], \\[1]];\n3. Add the second number (5) to all the existing subsets: \\[\\[], \\[1], \\[5], \\[1,5]];\n4. Add the third number (3) to all the existing subsets: \\[\\[], \\[1], \\[5], \\[1,5], \\[3], \\[1,3], \\[5,3], \\[1,5,3]].\n\nHere is a visual representation of the Subsets pattern:\n\n![Fahim ul Haq's image-ca65b](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-hemg3w8d.jpg?auto=format%2Ccompress&w=1920)\n\nHow to identify the Subsets pattern:\n\n- Problems where you need to find the combinations or permutations of a given set\n\nProblems featuring Subsets pattern:\n\n- Subsets With Duplicates (easy)\n- String Permutations by changing case (medium)\n\n**11. Modified binary\u00a0search**\n\nWhenever you are given a sorted array, linked list, or matrix, and are asked to find a certain element, the best algorithm you can use is the Binary Search. This pattern describes an efficient way to handle all problems involving Binary Search.\n\nThe patterns looks like this for an ascending order set:\n\n1. First, find the middle of start and end. An easy way to find the middle would be: middle = (start + end) / 2. But this has a good chance of producing an integer overflow so it\u2019s recommended that you represent the middle as:\u00a0middle = start + (end \u2014 start) / 2\n2. If the key is equal to the number at index middle then return middle\n3. If \u2018key\u2019 isn\u2019t equal to the index middle:\n4. Check if key < arr\\[middle]. If it is reduce your search to end = middle \u2014 1\n5. Check if key > arr\\[middle]. If it is reduce your search to end = middle + 1\n\nHere is a visual representation of the Modified Binary Search pattern:\n\n![Fahim ul Haq's image-543c9](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-kxno3wrs.jpg?auto=format%2Ccompress&w=1920)\n\n  \n\nProblems featuring the Modified Binary Search pattern:\n\nOrder-agnostic Binary Search (easy)Search\u00a0in a Sorted Infinite\u00a0Array\u00a0(medium)\n\n**12. Top K elements**\n\nAny problem that asks us to find the top/smallest/frequent \u2018K\u2019 elements among a given set falls under this pattern.\n\nThe best data structure to keep track of \u2018K\u2019 elements is Heap. This pattern will make use of the Heap to solve multiple problems dealing with \u2018K\u2019 elements at a time from a set of given elements. The pattern looks like this:\n\n1. Insert \u2018K\u2019 elements into the min-heap or max-heap based on the problem.\n2. Iterate through the remaining numbers and if you find one that is larger than what you have in the heap, then remove that number and insert the larger one.\n\n![Fahim ul Haq's image-b47a48](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-uuow3wb1.jpg?auto=format%2Ccompress&w=1920)\n\n  \n\nThere is no need for a sorting algorithm because the heap will keep track of the elements for you.\n\nHow to identify the Top \u2018K\u2019 Elements pattern:\n\n- If you\u2019re asked to find the top/smallest/frequent \u2018K\u2019 elements of a given set\n- If you\u2019re asked to sort an array to find an exact element\n\nProblems featuring Top \u2018K\u2019 Elements pattern:\n\n- Top \u2018K\u2019 Numbers (easy)\n- Top \u2018K\u2019 Frequent Numbers\u00a0(medium)\n\n**13. K-way Merge**\n\nK-way Merge helps you solve problems that involve a set of sorted arrays.\n\nWhenever you\u2019re given \u2018K\u2019 sorted arrays, you can use a Heap to efficiently perform a sorted traversal of all the elements of all arrays. You can push the smallest element of each array in a Min Heap to get the overall minimum. After getting the overall minimum, push the next element from the same array to the heap. Then, repeat this process to make a sorted traversal of all elements.\n\n![Fahim ul Haq's image-d12e48](https://hackernoon.imgix.net/images/G9YRlqC9joZNTWsi1ul7tRkO6tv1-4hwy3w8x.jpg?auto=format%2Ccompress&w=1920)\n\n  \n\nThe pattern looks like this:\n\n1. Insert the first element of each array in a Min Heap.\n2. After this, take out the smallest (top) element from the heap and add it to the merged list.\n3. After removing the smallest element from the heap, insert the next element of the same list into the heap.\n4. Repeat steps 2 and 3 to populate the merged list in sorted order.\n\nHow to identify the K-way\u00a0Merge\u00a0pattern:\n\n- The problem will feature sorted arrays, lists, or a matrix\n- If the problem asks you to merge sorted lists, find the smallest element in a sorted list.\n\nProblems featuring the K-way Merge pattern:\n\n- Merge K Sorted Lists (medium)\n- K Pairs with Largest Sums (Hard)\n\n**14. Topological sort**\n\nTopological Sort is used to find a linear ordering of elements that have dependencies on each other. For example, if event \u2018B\u2019 is dependent on event \u2018A\u2019, \u2018A\u2019 comes before \u2018B\u2019 in topological ordering.\n\nThis pattern defines an easy way to understand the technique for performing topological sorting of a set of elements.\n\nThe pattern works like this:\n\n1. Initialization  \n   a) Store the graph in adjacency lists by using a HashMap  \n   b) To find all sources, use a HashMap to keep the count of in-degreesBuild the graph and find in-degrees of all vertices\n2. Build the graph from the input and populate the in-degrees HashMap.\n3. Find all sources  \n   a) All vertices with \u20180\u2019 in-degrees will be sources and are stored in a Queue.\n4. Sort  \n   a) For each source, do the following things:  \n   \u2014i) Add it to the sorted list.  \n   \u2014 ii)Get all of its children from the graph.  \n   \u2014 iii)Decrement the in-degree of each child by 1.  \n   \u2014 iv)If a child\u2019s in-degree becomes \u20180\u2019, add it to the sources Queue.  \n   b) Repeat (a), until the source Queue is empty.\n\n![Fahim ul Haq's image-105df](https://hackernoon.imgix.net/photos/G9YRlqC9joZNTWsi1ul7tRkO6tv1-ve1473wvg?auto=format%2Ccompress&w=3840)\n\n  \n\nHow to identify the Topological Sort pattern:\n\n- The problem will deal with graphs that have no directed cycles\n- If you\u2019re asked to update all objects in a sorted order\n- If you have a class of objects that follow a particular order\n\nProblems featuring the Topological Sort pattern:\n\n- Task scheduling (medium)\n- Minimum height of a tree (hard)\n\n**What next?**\n\nExperiencing LeetCode fatigue? Learn these 14 patterns and you\u2019ll have a more complete picture of how to approach a problem no matter the question.\n\nIf you\u2019re interested in a deeper dive through the above patterns or the example problems under each one, check out\u00a0 [**Grokking Coding Interview Patterns in Java**](https://www.educative.io/courses/grokking-coding-interview-patterns-java?ref=hackernoon.com). It\u2019s the latest course in the Grokking interview series, used by 20,000+ learners to land jobs at top tech companies.\n\nThe highest endorsement I can give it is that I really wish it was around when I was still preparing for coding interviews.\n\n[\u2190 Previous The Top 10 Object-Oriented Design Interview Questions Developers Should Know](https://hackernoon.com/the-top-10-object-oriented-design-interview-questions-developers-should-know-c7fc2e13ce39) [Up Next \u2192 Why (and when) you should use Kubernetes](https://hackernoon.com/why-and-when-you-should-use-kubernetes-8b50915d97d8)\n\n### About Author\n\n[![Fahim ul Haq HackerNoon profile picture](https://hackernoon.imgix.net/images/avatars/G9YRlqC9joZNTWsi1ul7tRkO6tv1.jpg?auto=format%2Ccompress&w=3840)](https://hackernoon.com/u/fahimulhaq)\n\nby [**Fahim ul Haq**](https://hackernoon.com/u/fahimulhaq)| [@ fahimulhaq](https://hackernoon.com/u/fahimulhaq)\n\nEx-Microsoft, Ex-Facebook. Co-founder at Educative.io\n\nSubscribe\n\n[Read my stories](https://hackernoon.com/u/fahimulhaq) [About @fahimulhaq](https://hackernoon.com/about/fahimulhaq)\n\n#### TOPICS\n\n[Software Engineering](https://hackernoon.com/c/ai)\n\n[# coding](https://hackernoon.com/tagged/coding) [# interview](https://hackernoon.com/tagged/interview) [# leetcode](https://hackernoon.com/tagged/leetcode) [# software-engineering](https://hackernoon.com/tagged/software-engineering) [# technical-interviews](https://hackernoon.com/tagged/technical-interviews) [# coding-interviews](https://hackernoon.com/tagged/coding-interviews) [# latest-tech-stories](https://hackernoon.com/tagged/latest-tech-stories) [# hackernoon-top-story](https://hackernoon.com/tagged/hackernoon-top-story)\n\n## Light-Mode\n\n### Classic\n\n### Newspaper\n\n### Proof of Usefulness\n\n## Dark-Mode\n\n### Neon Noir\n\n### Minty\n\n### Startups of the Year\n\n```json\n{\"@context\":\"http://schema.org\",\"@type\":\"Article\",\"name\":\"14 Patterns to Ace Any Coding Interview Question\",\"headline\":\"14 Patterns to Ace Any Coding Interview Question\",\"author\":{\"@type\":\"Person\",\"name\":\"Fahim ul Haq\"},\"datePublished\":\"2019-05-29\",\"image\":\"https://hackernoon.imgix.net/images/interview-with-a-computer-developer-clgnf08id000001s698o4eedu.png\",\"articleSection\":\"coding\",\"articleBody\":\"The process of preparing for coding interviews is anxiety-inducing for many developers. There\u2019s\u00a0so much\u00a0material\u00a0to cover, and often much of it feels\u00a0irrelevant\u00a0to what devs are doing in their day jobs, which only adds to the stress. One of the outcomes of this is that it\u2019s now common for developers to spend weeks combing through hundreds of interview questions on sites like\u00a0LeetCode. One of the most common points of anxiety developers that I\u2019ve talked to have before the interview is:\u00a0Have I solved enough practice questions? Could I have done more? That\u2019s\u00a0why\u00a0I try to focus on helping\u00a0developers\u00a0grasp the\u00a0underlying patterns\u00a0behind each\u00a0question\u00a0\u2014 so they don\u2019t have to worry about solving hundreds of problems and suffer from Leetcode fatigue.\u00a0If you understand the generic patterns, you can\u00a0use them as a template to solve a myriad of other problems with slight variations. Here,\u00a0I\u2019ve laid out the top 14 patterns that can be used to solve any coding interview question,\u00a0as well as how to identify each pattern, and some example questions for each. This just touches the surface \u2014 I\u00a0strongly recommend checking out Grokking Coding Interview Patterns in Java\u00a0for comprehensive explanations, examples, and coding practice. The following patterns assume that you\u2019ve brushed up on Data Structures. If you haven\u2019t, check out this\u00a0refresher course on Data Structures. Let\u2019s get started! 1. Sliding Window The Sliding Window pattern is\u00a0used to perform a required operation on a specific window size of a given array or linked list, such as finding the longest subarray containing all 1s.\u00a0Sliding Windows start from the 1st element and keep shifting right by one element and adjust the length of the window according to the\u00a0problem\u00a0that you are solving. In some cases, the window size remains constant and in other cases the sizes grows or shrinks. Following\u00a0are some ways you can identify that the given problem might require a sliding window: The problem\u00a0input is a linear data structure such as a linked list, array, or stringYou\u2019re\u00a0asked to find the longest/shortest\u00a0substring, subarray, or a desired value Common problems you use the sliding window pattern with: Maximum\u00a0sum\u00a0subarray of size \u2018K\u2019\u00a0(easy)Longest substring\u00a0with \u2018K\u2019\u00a0distinct\u00a0characters (medium)String anagrams (hard) 2. Two Pointers or Iterators Two Pointers is\u00a0a pattern where two pointers iterate through the data structure in tandem until one or both of the pointers hit a certain condition.Two Pointers is often useful when searching pairs in a sorted array or linked list; for example, when you have to compare each element of an array to its other elements. Two pointers are needed because with just pointer, you would have to continually loop back through the array to find the answer. This back and forth\u00a0with a single iterator is inefficient for time and space complexity \u2014 a concept referred to as asymptotic analysis.\u00a0While the brute force or naive solution with 1 pointer would work, it will\u00a0produce something along the lines of O(n\u00b2). In many cases, two pointers can help you find a solution with better space or\u00a0runtime complexity. Ways to identify when to use the Two Pointer method: It will feature problems where you deal with sorted arrays (or Linked Lists) and need to find a set of elements that fulfill certain constraintsThe set of elements in the array is a pair, a triplet, or even a subarray Here are some problems that\u00a0feature\u00a0the Two Pointer pattern: Squaring a sorted array (easy)Triplets that sum to zero (medium)Comparing strings that contain backspaces (medium) 3. Fast and Slow pointersThe Fast and Slow pointer approach, also known as the\u00a0Hare &amp; Tortoise algorithm, is a pointer algorithm that uses two pointers which move through the array (or sequence/linked list)\u00a0at different speeds.\u00a0This approach is quite useful when dealing with cyclic linked lists or arrays. By moving at different speeds (say, in a cyclic linked list), the algorithm proves that the two pointers are bound to meet. The fast pointer should catch the slow pointer once both the pointers are in a cyclic loop. How do you identify when to use the Fast and Slow pattern? The problem will deal with a loop in a linked list or arrayWhen you need to know the position of a certain element or the overall length of the linked list. When should I use it over the Two Pointer method mentioned above? There are some cases where you shouldn\u2019t use the Two Pointer approach such as in a singly linked list where you can\u2019t move in a backwards direction. An example of when to use the Fast and Slow pattern is when you\u2019re trying to determine if a linked list is a palindrome. Problems featuring the fast and slow pointers pattern: Linked List Cycle (easy)Palindrome Linked List\u00a0(medium)Cycle in a Circular Array\u00a0(hard)4. Merge Intervals The Merge Intervals pattern is an efficient technique to deal with overlapping\u00a0intervals. In a lot of problems involving intervals, you either need to find overlapping intervals or merge intervals if they overlap. The pattern works like this: Given two intervals (\u2018a\u2019 and \u2018b\u2019), there will be six different ways the two intervals can relate to each other: Understanding and recognizing these six cases will help you help you solve a wide range of problems from inserting intervals to optimizing interval merges. How do you identify when to use the Merge Intervals pattern? If you\u2019re asked to produce a list with only mutually exclusive intervalsIf you hear the term \u201coverlapping intervals\u201d.Merge interval problem patterns: Intervals Intersection (medium)Maximum CPU Load (hard) 5. Cyclic sort This pattern describes an interesting approach to deal with problems involving arrays containing numbers in a given range.\u00a0The Cyclic Sort pattern iterates over the array one number at a time, and if the current number you are iterating is not at the correct index, you swap it with the number at its correct index.\u00a0You could try placing the number in its correct index, but this will produce a complexity of O(n^2) which is not optimal, hence the Cyclic Sort pattern. How do I identify this pattern? They will be problems involving a sorted array with numbers in a given rangeIf the problem asks you to find the missing/duplicate/smallest number in an sorted/rotated array Problems featuring cyclic sort pattern: Find the Missing Number (easy)Find the Smallest Missing Positive Number\u00a0(medium) 6. In-place reversal of linked list In a lot of problems, you may be asked to reverse the links between a set of nodes of a linked list. Often, the constraint is that you need to do this in-place, i.e., using the existing node objects and without using extra memory. This is where the above mentioned pattern is useful. This pattern reverses one node at a time starting with one variable (current) pointing to the head of the linked list, and one variable (previous) will point to the previous node that you have processed. In a lock-step manner, you will reverse the current node by pointing it to the previous before moving on to the next node. Also, you will update the variable \u201cprevious\u201d to always point to the previous node that you have processed. How do I identify when to use this pattern: If you\u2019re asked to reverse a linked list without using extra memory Problems featuring in-place reversal of linked list pattern: Reverse a Sub-list (medium)Reverse every K-element Sub-list (medium) 7. Tree BFS This pattern is based on the Breadth First Search (BFS) technique to traverse a tree and uses a queue to keep track of all the nodes of a level before jumping onto the next level. Any problem involving the traversal of a tree in a level-by-level order can be efficiently solved using this approach. The Tree BFS pattern works by pushing the root node to the queue and then continually iterating until the queue is empty. For each iteration, we remove the node at the head of the queue and \u201cvisit\u201d that node. After removing each node from the queue, we also insert all of its children into the queue. How to identify the Tree BFS pattern: If you\u2019re asked to traverse a tree in a level-by-level fashion (or level order traversal) Problems featuring Tree BFS pattern: Binary Tree Level Order Traversal (easy) Zigzag Traversal (medium) 8. Tree DFS Tree DFS is based on the Depth First Search (DFS) technique to traverse a tree. You can use recursion (or a stack for the iterative approach) to keep track of all the previous (parent) nodes while traversing. The Tree DFS pattern works by starting at the root of the tree, if the node is not a leaf you need to do three things: Decide whether to process the current node now (pre-order), or between processing two children (in-order) or after processing both children (post-order).Make two recursive calls for both the children of the current node to process them. How to identify the Tree DFS pattern: If you\u2019re asked to traverse a tree with in-order, preorder, or postorder DFSIf the problem requires searching for something where the node is closer to a leaf Problems featuring Tree DFS pattern: Sum of Path Numbers (medium)All Paths for a Sum\u00a0(medium) 9. Two heaps In many problems, we are given a set of elements such that we can divide them into two parts. To solve the problem, we are interested in knowing the smallest element in one part and the biggest element in the other part. This pattern is an efficient approach to solve such problems. This pattern uses two heaps; A Min Heap to find the smallest element and a Max Heap to find the biggest element. The pattern works by storing the first half of numbers in a Max Heap, this is because you want to find the largest number in the first half. You then store the second half of numbers in a Min Heap, as you want to find the smallest number in the second half.\u00a0At any time, the median of the current list of numbers can be calculated from the top element of the two heaps. Ways to identify the Two Heaps pattern: Useful in situations like Priority Queue, SchedulingIf the problem states that you need to find the smallest/largest/median elements of a setSometimes, useful in problems featuring a binary tree data structure Problems featuring Find the Median of a Number Stream (medium)10. Subsets A huge number of coding interview problems involve dealing with Permutations and Combinations of a given set of elements. The pattern Subsets describes an efficient Breadth First Search (BFS) approach to handle all these problems. The pattern looks like this: Given a set of [1, 5, 3] Start with an empty set: [[]]Add the first number (1) to all the existing subsets to create new subsets: [[], [1]];Add the second number (5) to all the existing subsets: [[], [1], [5], [1,5]];Add the third number (3) to all the existing subsets: [[], [1], [5], [1,5], [3], [1,3], [5,3], [1,5,3]]. Here is a visual representation of the Subsets pattern: How to identify the Subsets pattern: Problems where you need to find the combinations or permutations of a given setProblems featuring Subsets pattern: Subsets With Duplicates (easy)String Permutations by changing case (medium) 11. Modified binary\u00a0search Whenever you are given a sorted array, linked list, or matrix, and are asked to find a certain element, the best algorithm you can use is the Binary Search. This pattern describes an efficient way to handle all problems involving Binary Search. The patterns looks like this for an ascending order set: First, find the middle of start and end. An easy way to find the middle would be: middle = (start + end) / 2. But this has a good chance of producing an integer overflow so it\u2019s recommended that you represent the middle as:\u00a0middle = start + (end \u2014 start) / 2If the key is equal to the number at index middle then return middleIf \u2018key\u2019 isn\u2019t equal to the index middle:Check if key &lt; arr[middle]. If it is reduce your search to end = middle \u2014 1Check if key &gt; arr[middle]. If it is reduce your search to end = middle + 1 Here is a visual representation of the Modified Binary Search pattern: Problems featuring the Modified Binary Search pattern: Order-agnostic Binary Search (easy)Search\u00a0in a Sorted Infinite\u00a0Array\u00a0(medium) 12. Top K elements Any problem that asks us to find the top/smallest/frequent \u2018K\u2019 elements among a given set falls under this pattern. The best data structure to keep track of \u2018K\u2019 elements is Heap. This pattern will make use of the Heap to solve multiple problems dealing with \u2018K\u2019 elements at a time from a set of given elements. The pattern looks like this: Insert \u2018K\u2019 elements into the min-heap or max-heap based on the problem.Iterate through the remaining numbers and if you find one that is larger than what you have in the heap, then remove that number and insert the larger one. There is no need for a sorting algorithm because the heap will keep track of the elements for you. How to identify the Top \u2018K\u2019 Elements pattern: If you\u2019re asked to find the top/smallest/frequent \u2018K\u2019 elements of a given setIf you\u2019re asked to sort an array to find an exact element Problems featuring Top \u2018K\u2019 Elements pattern: Top \u2018K\u2019 Numbers (easy)Top \u2018K\u2019 Frequent Numbers\u00a0(medium) 13. K-way Merge K-way Merge helps you solve problems that involve a set of sorted arrays. Whenever you\u2019re given \u2018K\u2019 sorted arrays, you can use a Heap to efficiently perform a sorted traversal of all the elements of all arrays. You can push the smallest element of each array in a Min Heap to get the overall minimum. After getting the overall minimum, push the next element from the same array to the heap. Then, repeat this process to make a sorted traversal of all elements. The pattern looks like this: Insert the first element of each array in a Min Heap.After this, take out the smallest (top) element from the heap and add it to the merged list.After removing the smallest element from the heap, insert the next element of the same list into the heap.Repeat steps 2 and 3 to populate the merged list in sorted order. How to identify the K-way\u00a0Merge\u00a0pattern: The problem will feature sorted arrays, lists, or a matrixIf the problem asks you to merge sorted lists, find the smallest element in a sorted list. Problems featuring the K-way Merge pattern: Merge K Sorted Lists (medium)K Pairs with Largest Sums (Hard) 14. Topological sort Topological Sort is used to find a linear ordering of elements that have dependencies on each other. For example, if event \u2018B\u2019 is dependent on event \u2018A\u2019, \u2018A\u2019 comes before \u2018B\u2019 in topological ordering. This pattern defines an easy way to understand the technique for performing topological sorting of a set of elements. The pattern works like this: Initializationa) Store the graph in adjacency lists by using a HashMapb) To find all sources, use a HashMap to keep the count of in-degreesBuild the graph and find in-degrees of all verticesBuild the graph from the input and populate the in-degrees HashMap.Find all sourcesa) All vertices with \u20180\u2019 in-degrees will be sources and are stored in a Queue.Sorta) For each source, do the following things:\u2014i) Add it to the sorted list.\u2014 ii)Get all of its children from the graph.\u2014 iii)Decrement the in-degree of each child by 1.\u2014 iv)If a child\u2019s in-degree becomes \u20180\u2019, add it to the sources Queue.b) Repeat (a), until the source Queue is empty. How to identify the Topological Sort pattern: The problem will deal with graphs that have no directed cyclesIf you\u2019re asked to update all objects in a sorted orderIf you have a class of objects that follow a particular order Problems featuring the
