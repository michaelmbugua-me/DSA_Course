<script>document.addEventListener('DOMContentLoaded', () => render("# Min Heap and Max Heap Implementation in Java\n\n> Source: https://www.techiedelight.com/min-heap-max-heap-implementation-in-java/\n\nImplement a heap data structure in Java.\n\n**Prerequisite:**\n\n> [Introduction to Priority Queues using Binary Heaps](https://techiedelight.com/introduction-priority-queues-using-binary-heaps/)\n\nIn the above post, we have introduced the heap data structure and covered `heapify-up`, `push`, `heapify-down`, and `pop` operations. In this post, Java implementation of Max Heap and Min Heap is discussed.\n\n## 1\\. Max Heap implementation in Java\n\nFollowing is Java implementation of max-heap data structure. We have tried to keep the implementation similar to the [java.util.PriorityQueue](https://docs.oracle.com/javase/7/docs/api/java/util/PriorityQueue.html) class.\n\n```\nimport java.util.Arrays;\nimport java.util.Vector;\n\n// A class for implementing the priority queue\nclass PriorityQueue\n{\n    // vector to store heap elements\n    private Vector<Integer> A;\n\n    // constructor: use the default initial capacity of a vector\n    public PriorityQueue() {\n        A = new Vector();\n    }\n\n    // constructor: set a custom initial capacity for vector\n    public PriorityQueue(int capacity) {\n        A = new Vector(capacity);\n    }\n\n    // return parent of `A[i]`\n    private int parent(int i)\n    {\n        // if `i` is already a root node\n        if (i == 0) {\n            return 0;\n        }\n\n        return (i - 1) / 2;\n    }\n\n    // return left child of `A[i]`\n    private int LEFT(int i) {\n        return (2*i + 1);\n    }\n\n    // return right child of `A[i]`\n    private int RIGHT(int i) {\n        return (2*i + 2);\n    }\n\n    // swap values at two indexes\n    void swap(int x, int y)\n    {\n        // swap with a child having greater value\n        Integer temp = A.get(x);\n        A.setElementAt(A.get(y), x);\n        A.setElementAt(temp, y);\n    }\n\n    // Recursive heapify-down procedure. Here, the node at index `i`\n    // and its two direct children violate the heap property\n    private void heapify_down(int i)\n    {\n        // get left and right child of node at index `i`\n        int left = LEFT(i);\n        int right = RIGHT(i);\n\n        int largest = i;\n\n        // compare `A[i]` with its left and right child\n        // and find the largest value\n        if (left < size() && A.get(left) > A.get(i)) {\n            largest = left;\n        }\n\n        if (right < size() && A.get(right) > A.get(largest)) {\n            largest = right;\n        }\n\n        if (largest != i)\n        {\n            // swap with a child having greater value\n            swap(i, largest);\n\n            // call heapify-down on the child\n            heapify_down(largest);\n        }\n    }\n\n    // Recursive heapify-up procedure\n    private void heapify_up(int i)\n    {\n        // check if the node at index `i` and its parent violates\n        // the heap property\n        if (i > 0 && A.get(parent(i)) < A.get(i))\n        {\n            // swap the two if heap property is violated\n            swap(i, parent(i));\n\n            // call heapify-up on the parent\n            heapify_up(parent(i));\n        }\n    }\n\n    // return size of the heap\n    public int size() {\n        return A.size();\n    }\n\n    // check if the heap is empty or not\n    public Boolean isEmpty() {\n        return A.isEmpty();\n    }\n\n    // insert a specified key into the heap\n    public void add(Integer key)\n    {\n        // insert a new element at the end of the vector\n        A.addElement(key);\n\n        // get element index and call heapify-up procedure\n        int index = size() - 1;\n        heapify_up(index);\n    }\n\n    // Function to remove and return an element with the highest priority\n    // (present at the root). It returns null if the queue is empty\n    public Integer poll()\n    {\n        try {\n            // if the heap is empty, throw an exception\n            if (size() == 0) {\n                throw new Exception(\"Index is out of range (Heap underflow)\");\n            }\n\n            // element with the highest priority\n            int root = A.firstElement();    // or A.get(0);\n\n            // replace the root of the heap with the last element of the vector\n            A.setElementAt(A.lastElement(), 0);\n            A.remove(size() - 1);\n\n            // call heapify-down on the root node\n            heapify_down(0);\n\n            // return root element\n            return root;\n        }\n        // catch and print the exception\n        catch (Exception ex)\n        {\n            System.out.println(ex);\n            return null;\n        }\n    }\n\n    // Function to return an element with the highest priority\n    // (present at the root). It returns null if the queue is empty\n    public Integer peek()\n    {\n        try {\n            // if the heap has no elements, throw an exception\n            if (size() == 0) {\n                throw new Exception(\"Index out of range (Heap underflow)\");\n            }\n\n            // otherwise, return the top (first) element\n            return A.firstElement();    // or A.get(0);\n        }\n        // catch the exception and print it, and return null\n        catch (Exception ex)\n        {\n            System.out.println(ex);\n            return null;\n        }\n    }\n\n    // Function to remove all elements from the priority queue\n    public void clear()\n    {\n        System.out.print(\"Emptying queue: \");\n        while (!A.isEmpty()) {\n            System.out.print(poll() + \" \");\n        }\n        System.out.println();\n    }\n\n    // Returns true if the queue contains the specified element\n    public Boolean contains(Integer i) {\n        return A.contains(i);\n    }\n\n    // Returns an array containing all elements in the queue\n    public Integer[] toArray() {\n        return A.toArray(new Integer[size()]);\n    }\n}\n\nclass Main\n{\n    public static void main (String[] args)\n    {\n        // create a priority queue with an initial capacity of 10.\n        // The value of an element decides the priority of it.\n        PriorityQueue pq = new PriorityQueue(10);\n\n        // insert three integers\n        pq.add(3);\n        pq.add(2);\n        pq.add(15);\n\n        // print priority queue size\n        System.out.println(\"Priority queue size is \" + pq.size());\n\n        // search 2 in priority queue\n        Integer searchKey = 2;\n\n        if (pq.contains(searchKey)) {\n            System.out.println(\"Priority queue contains \" + searchKey + \"\\n\");\n        }\n\n        // empty queue\n        pq.clear();\n\n        if (pq.isEmpty()) {\n            System.out.println(\"The queue is empty\");\n        }\n\n        System.out.println(\"\\nCalling remove operation on an empty heap\");\n        System.out.println(\"The element with the highest priority is \" + pq.poll());\n\n        System.out.println(\"\\nCalling peek operation on an empty heap\");\n        System.out.println(\"The element with the highest priority is \" + pq.peek() +\n                    System.lineSeparator());\n\n        // again insert three integers\n        pq.add(5);\n        pq.add(4);\n        pq.add(45);\n\n        // construct an array containing all elements present in the queue\n        Integer[] I = pq.toArray();\n        System.out.println(\"Printing array: \" + Arrays.toString(I));\n\n        System.out.println(\"\\nThe element with the highest priority is \" + pq.poll());\n        System.out.println(\"The element with the highest priority is \" + pq.peek());\n    }\n}\n```\n\n**Output:** Priority queue size is 3 Priority queue contains 2 Emptying queue: 15 3 2 The queue is empty Calling remove operation on an empty heap java.lang.Exception: Index out of range(Heap underflow) The element with the highest priority is null Calling peek operation on an empty heap java.lang.Exception: Index out of range (Heap underflow) The element with the highest priority is null Printing array: [45, 4, 5] The element with the highest priority is 45 The element with the highest priority is 5\n\n## 2\\. Min Heap implementation in Java\n\nThe min-heap implementation is very similar to the max-heap implementation discussed above. The highlighted portion in the following code marks its differences with max-heap implementation:\n\n```\nimport java.util.Arrays;\nimport java.util.Vector;\n\n// A class for implementing the Priority queue\nclass PriorityQueue\n{\n    // vector to store heap elements\n    private Vector<Integer> A;\n\n    // constructor: use the default initial capacity of a vector\n    public PriorityQueue() {\n        A = new Vector();\n    }\n\n    // constructor: set a custom initial capacity for vector\n    public PriorityQueue(int capacity) {\n        A = new Vector(capacity);\n    }\n\n    // return parent of `A[i]`\n    private int parent(int i)\n    {\n        // if `i` is already a root node\n        if (i == 0) {\n            return 0;\n        }\n\n        return (i - 1) / 2;\n    }\n\n    // return left child of `A[i]`\n    private int LEFT(int i) {\n        return (2*i + 1);\n    }\n\n    // return right child of `A[i]`\n    private int RIGHT(int i) {\n        return (2*i + 2);\n    }\n\n    // swap values at two indexes\n    void swap(int x, int y)\n    {\n        // swap with a child having greater value\n        Integer temp = A.get(x);\n        A.setElementAt(A.get(y), x);\n        A.setElementAt(temp, y);\n    }\n\n    // Recursive heapify-down procedure. Here, the node at index `i`\n    // and its two direct children violate the heap property\n    private void heapify_down(int i)\n    {\n        // get left and right child of node at index `i`\n        int left = LEFT(i);\n        int right = RIGHT(i);\n\n        int smallest = i;\n\n        // compare `A[i]` with its left and right child\n        // and find the smallest value\n        if (left < size() && A.get(left) < A.get(i)) {\n            smallest = left;\n        }\n\n        if (right < size() && A.get(right) < A.get(smallest)) {\n            smallest = right;\n        }\n\n        if (smallest != i)\n        {\n            // swap with a child having lesser value\n            swap(i, smallest);\n\n            // call heapify-down on the child\n            heapify_down(smallest);\n        }\n    }\n\n    // Recursive heapify-up procedure\n    private void heapify_up(int i)\n    {\n        // check if the node at index `i` and its parent violates\n        // the heap property\n        if (i > 0 && A.get(parent(i)) > A.get(i))\n        {\n            // swap the two if heap property is violated\n            swap(i, parent(i));\n\n            // call heapify-up on the parent\n            heapify_up(parent(i));\n        }\n    }\n\n    // return size of the heap\n    public int size() {\n        return A.size();\n    }\n\n    // check if the heap is empty or not\n    public Boolean isEmpty() {\n        return A.isEmpty();\n    }\n\n    // insert a specified key into the heap\n    public void add(Integer key)\n    {\n        // insert a new element at the end of the vector\n        A.addElement(key);\n\n        // get its index and call the heapify-up procedure\n        int index = size() - 1;\n        heapify_up(index);\n    }\n\n    // Function to remove and return an element with the highest priority\n    // (present at the root). It returns null if the queue is empty\n    public Integer poll()\n    {\n        try {\n            // if the heap is empty, throw an exception\n            if (size() == 0) {\n                throw new Exception(\"Index is out of range (Heap underflow)\");\n            }\n\n            // element with the highest priority\n            int root = A.firstElement();    // or A.get(0);\n\n            // replace the root of the heap with the last element of the vector\n            A.setElementAt(A.lastElement(), 0);\n            A.remove(size() - 1);\n\n            // call heapify-down on the root node\n            heapify_down(0);\n\n            // return root element\n            return root;\n        }\n        // catch and print the exception\n        catch (Exception ex)\n        {\n            System.out.println(ex);\n            return null;\n        }\n    }\n\n    // Function to return an element with the highest priority\n    // (present at the root). It returns null if the queue is empty\n    public Integer peek()\n    {\n        try {\n            // if the heap has no elements, throw an exception\n            if (size() == 0) {\n                throw new Exception(\"Index out of range (Heap underflow)\");\n            }\n\n            // otherwise, return the top (first) element\n            return A.firstElement();    // or A.get(0);\n        }\n        // catch the exception and print it, and return null\n        catch (Exception ex)\n        {\n            System.out.println(ex);\n            return null;\n        }\n    }\n\n    // Function to remove all elements from the priority queue\n    public void clear()\n    {\n        System.out.print(\"Emptying queue: \");\n        while (!A.isEmpty()) {\n            System.out.print(poll() + \" \");\n        }\n        System.out.println();\n    }\n\n    // Returns true if the queue contains the specified element\n    public Boolean contains(Integer i) {\n        return A.contains(i);\n    }\n\n    // Returns an array containing all elements in the queue\n    public Integer[] toArray() {\n        return A.toArray(new Integer[size()]);\n    }\n}\n\nclass Main\n{\n    public static void main (String[] args)\n    {\n        // create a priority queue with an initial capacity of 10.\n        // The value of an element decides the priority of it.\n        PriorityQueue pq = new PriorityQueue(10);\n\n        // insert three integers\n        pq.add(3);\n        pq.add(2);\n        pq.add(15);\n\n        // print priority queue size\n        System.out.println(\"Priority queue size is \" + pq.size());\n\n        // search 2 in priority queue\n        Integer searchKey = 2;\n\n        if (pq.contains(searchKey)) {\n            System.out.println(\"Priority queue contains \" + searchKey + \"\\n\");\n        }\n\n        // empty queue\n        pq.clear();\n\n        if (pq.isEmpty()) {\n            System.out.println(\"The queue is empty\");\n        }\n\n        System.out.println(\"\\nCalling remove operation on an empty heap\");\n        System.out.println(\"The element with the highest priority is \" + pq.poll());\n\n        System.out.println(\"\\nCalling peek operation on an empty heap\");\n        System.out.println(\"The element with the highest priority is \" + pq.peek() +\n                    System.lineSeparator());\n\n        // again insert three integers\n        pq.add(5);\n        pq.add(4);\n        pq.add(45);\n\n        // construct an array containing all elements present in the queue\n        Integer[] I = pq.toArray();\n        System.out.println(\"Printing array: \" + Arrays.toString(I));\n\n        System.out.println(\"\\nThe element with the highest priority is \" + pq.poll());\n        System.out.println(\"The element with the highest priority is \" + pq.peek());\n    }\n}\n```\n\n**Output:** Priority queue size is 3 Priority queue contains 2 Emptying queue: 2 3 15 The queue is empty Calling remove operation on an empty heap java.lang.Exception: Index out of range(Heap underflow) The element with the highest priority is null Calling peek operation on an empty heap java.lang.Exception: Index out of range (Heap underflow) The element with the highest priority is null Printing array: [4, 5, 45] The element with the highest priority is 4 The element with the highest priority is 5\n\nFollowing is the time complexity of implemented heap operations:\n\n  1. `add()` and `poll()` takes O(log(n)) time.\n  2. `toArray()` and `contains()` takes O(n) time.\n  3. `peek()` and `size()` and `isEmpty()` takes O(1) time.\n\n**Also See:**\n\n> [Min Heap and Max Heap Implementation in C++](https://techiedelight.com/min-heap-max-heap-implementation-c/)\n\n**Exercise:** Implement Heap in Java using [ArrayList](https://docs.oracle.com/javase/7/docs/api/java/util/ArrayList.html) instead of a Vector.\n\n**References:** <https://en.wikipedia.org/wiki/Heap_(data_structure)>\n\nRate this post\n\n  * __\n  * __\n  * __\n  * __\n  * __\n\nSubmit Rating\n\nAverage rating 4.63/5. Vote count: 65\n\nNo votes so far! Be the first to rate this post.\n\nWe are sorry that this post was not useful for you!\n\nTell us how we can improve this post?\n\nSubmit Feedback\n\nTagged [Beginner](https://www.techiedelight.com/Tags/Beginner/), [Priority Queue](https://www.techiedelight.com/Tags/Priority-Queue/), [Recursive](https://www.techiedelight.com/Tags/Recursion/)\n\n**Thanks for reading.**\n\nTo share your code in the comments, please use our [online compiler](https://techiedelight.com/compiler/) that supports C, C++, Java, Python, JavaScript, C#, PHP, and many more popular programming languages.\n\n**Like us? Refer us to your friends and support our growth. Happy coding** :)\n", "/solutions/min-heap-max-heap-implementation-in-java.md"));</script>
