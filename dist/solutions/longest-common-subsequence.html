<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Longest Common Subsequence</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d10'/%3E%3Cpath d='M10 10v12l12-6z' fill='%23d9a253'/%3E%3C/svg%3E"><script>document.documentElement.dataset.theme=localStorage.getItem("theme")||"light";</script><link rel="stylesheet" href="/assets/style.css"><script src="/assets/marked.min.js"></script><script src="/assets/prism.js"></script><script src="/assets/app.js"></script></head><body>

<script>document.addEventListener('DOMContentLoaded', () => render("# Longest Common Subsequence Problem\n\n> Source: https://www.techiedelight.com/longest-common-subsequence/\n\nThe Longest Common Subsequence (LCS) problem is finding the longest subsequence present in given two sequences in the same order, i.e., find the longest sequence which can be obtained from the first original sequence by deleting some items and from the second original sequence by deleting other items.\n\nThe problem differs from the problem of finding the [longest common substring](https://techiedelight.com/longest-common-substring-problem/). Unlike substrings, [subsequences](https://techiedelight.com/difference-between-subarray-subsequence-subset/#subsequence) are not required to occupy consecutive positions within the original string.\n\nFor example, consider the two following sequences, `X` and `Y`:\n\nX: ABCBDAB Y: BDCABA The length of the LCS is 4 LCS are BDAB, BCAB, and BCBA\n\n> \n\nA naive solution is to check if every subsequence of `X[1\u2026m]` to see if it is also a subsequence of `Y[1\u2026n]`. As there are `2m` subsequences possible of `X`, the time complexity of this solution would be O(n.2m), where `m` is the length of the first string and `n` is the length of the second string.\n\nThe LCS problem has [optimal substructure](https://techiedelight.com/introduction-dynamic-programming/#optimal-substructure). That means the problem can be broken down into smaller, simple \u201csubproblems\u201d, which can be broken down into yet simpler subproblems, and so on, until, finally, the solution becomes trivial.\n\n**1\\. Let\u2019s consider two sequences,`X` and `Y`, of length `m` and `n` that both end in the same element.**\n\nTo find their LCS, shorten each sequence by removing the last element, find the LCS of the shortened sequences, and that LCS append the removed element. So, we can say that.\n\nLCS(X[1\u2026m], Y[1\u2026n]) = LCS(X[1\u2026m-1], Y[1\u2026n-1]) + X[m] if X[m] = Y[n]\n\n**2\\. Now suppose that the two sequences does not end in the same symbol.**\n\nThen the LCS of `X` and `Y` is the longer of the two sequences `LCS(X[1\u2026m-1], Y[1\u2026n])` and `LCS(X[1\u2026m], Y[1\u2026n-1])`. To understand this property, let\u2019s consider the two following sequences:\n\nX: ABCBDAB _(n elements)_ Y: BDCABA _(m elements)_\n\nThe LCS of these two sequences either ends with `B` (the last element of the sequence `X`) or does not.\n\n**Case 1:** If LCS ends with `B`, then it cannot end with `A`, and we can remove `A` from the sequence `Y`, and the problem reduces to `LCS(X[1\u2026m], Y[1\u2026n-1])`.\n\n**Case 2:** If LCS does not end with `B`, then we can remove `B` from sequence `X` and the problem reduces to `LCS(X[1\u2026m-1], Y[1\u2026n])`. For example,\n\nLCS(ABCBDAB, BDCABA) = maximum (LCS(ABCBDA, BDCABA), LCS(ABCBDAB, BDCAB)) LCS(ABCBDA, BDCABA) = LCS(ABCBD, BDCAB) + A LCS(ABCBDAB, BDCAB) = LCS(ABCBDA, BDCA) + B LCS(ABCBD, BDCAB) = maximum (LCS(ABCB, BDCAB), LCS(ABCBD, BDCA)) LCS(ABCBDA, BDCA) = LCS(ABCBD, BDC) + A And so on\u2026\n\nThe following solution in TypeScript find the length of LCS of sequences `X[0\u2026m-1]` and `Y[0\u2026n-1]` recursively using the LCS problem\u2019s optimal substructure property:\n\n```ts\n// Function to find the length of the longest common subsequence of\n// sequences `X[0\u2026m-1]` and `Y[0\u2026n-1]`\nfunction LCSLength(X: string, Y: string, m: number, n: number): number {\n  // return if the end of either sequence is reached\n  if (m === 0 || n === 0) {\n    return 0;\n  }\n\n  // if the last character of `X` and `Y` matches\n  if (X[m - 1] === Y[n - 1]) {\n    return LCSLength(X, Y, m - 1, n - 1) + 1;\n  }\n\n  // otherwise, if the last character of `X` and `Y` don't match\n  return Math.max(LCSLength(X, Y, m, n - 1), LCSLength(X, Y, m - 1, n));\n}\n\nconst X = 'ABCBDAB';\nconst Y = 'BDCABA';\n\nconsole.log('The length of the LCS is', LCSLength(X, Y, X.length, Y.length));\n```\n\n**Output:** The length of the LCS is 4\n\nThe worst-case time complexity of the above solution is O(2(m+n)) and occupies space in the call stack, where `m` and `n` are the length of the strings `X` and `Y`. The worst case happens when there is no common subsequence present in `X` and `Y` (i.e., LCS is 0), and each recursive call will end up in two recursive calls.\n\nThe LCS problem exhibits [overlapping subproblems](https://techiedelight.com/introduction-dynamic-programming/#overlapping-subproblems). A problem is said to have overlapping subproblems if the recursive algorithm for the problem solves the same subproblem repeatedly rather than generating new subproblems.\n\nLet\u2019s consider the recursion tree for two sequences of length 6 and 8 whose LCS is 0.\n\nAs we can see, the same subproblems (highlighted in the same color) are getting computed repeatedly. We know that problems having optimal substructure and overlapping subproblems can be solved by dynamic programming, in which subproblem solutions are memoized rather than computed repeatedly. This method is demonstrated below in TypeScript:\n\n```ts\n// Function to find the length of the longest common subsequence of substring\n// `X[0\u2026m-1]` and `Y[0\u2026n-1]`\nfunction LCSLength(X: string, Y: string, m: number, n: number, lookup: Map<string, number>): number {\n  // return if the end of either string is reached\n  if (m === 0 || n === 0) {\n    return 0;\n  }\n\n  // construct a unique map key from dynamic elements of the input\n  const key = `${m}|${n}`;\n\n  // if the subproblem is seen for the first time, solve it and\n  // store its result in a map\n  if (!lookup.has(key)) {\n    // if the last character of `X` and `Y` matches\n    if (X[m - 1] === Y[n - 1]) {\n      lookup.set(key, LCSLength(X, Y, m - 1, n - 1, lookup) + 1);\n    } else {\n      // otherwise, if the last character of `X` and `Y` don't match\n      lookup.set(key, Math.max(LCSLength(X, Y, m, n - 1, lookup),\n        LCSLength(X, Y, m - 1, n, lookup)));\n    }\n  }\n\n  // return the subproblem solution from the map\n  return lookup.get(key)!;\n}\n\nconst X = 'ABCBDAB';\nconst Y = 'BDCABA';\n\n// create a map to store solutions to subproblems\nconst lookup = new Map<string, number>();\n\nconsole.log('The length of the LCS is', LCSLength(X, Y, X.length, Y.length, lookup));\n```\n\n**Output:** The length of the LCS is 4\n\nThe time complexity of the above top-down solution is O(m.n) and requires O(m.n) extra space, where `m` and `n` are the length of the strings `X` and `Y`. Note that we can also use an array instead of a map. Check implementation [here](https://techiedelight.com/compiler/?run=rZTKVS).\n\nThe above _memo_ ized version follows the top-down approach since we first break the problem into subproblems and then calculate and store values. We can also solve this problem in a bottom-up manner. In the bottom-up approach, we calculate the smaller values of `LCS(i, j)` first, then build larger values from them.\n\n| 0 if i == 0 or j == 0 LCS[i][j] = | LCS[i \u2013 1][j \u2013 1] + 1 if X[i-1] == Y[j-1] | longest(LCS[i \u2013 1][j], LCS[i][j \u2013 1]) if X[i-1] != Y[j-1]\n\nLet `X` be `XMJYAUZ`, and `Y` be `MZJAWXU`. The longest common subsequence between `X` and `Y` is `MJAU`. The following table is generated by the function `LCSLength()`, which shows the LCS\u2019s length between prefixes of `X` and `Y`. The `i'th` row and `j'th` column show the LCS\u2019s length of substring `X[0\u2026i-1]` and `Y[0\u2026j-1]`.\n\nThis is demonstrated below in TypeScript:\n\n```ts\n// Function to find the length of the longest common subsequence of substring\n// `X[0\u2026m-1]` and `Y[0\u2026n-1]`\nfunction LCSLength(X: string, Y: string): number {\n  const m = X.length, n = Y.length;\n\n  // lookup table stores solution to already computed subproblems;\n  // i.e., `lookup[i][j]` stores the length of LCS of substring\n  // `X[0\u2026i-1]` and `Y[0\u2026j-1]`\n  const lookup: number[][] = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));\n\n  // fill the lookup table in a bottom-up manner\n  for (let i = 1; i <= m; i++) {\n    for (let j = 1; j <= n; j++) {\n      // if the current character of `X` and `Y` matches\n      if (X[i - 1] === Y[j - 1]) {\n        lookup[i][j] = lookup[i - 1][j - 1] + 1;\n      }\n      // otherwise, if the current character of `X` and `Y` don't match\n      else {\n        lookup[i][j] = Math.max(lookup[i - 1][j], lookup[i][j - 1]);\n      }\n    }\n  }\n\n  // LCS will be the last entry in the lookup table\n  return lookup[m][n];\n}\n\nconst X = 'XMJYAUZ', Y = 'MZJAWXU';\n\nconsole.log('The length of the LCS is', LCSLength(X, Y));\n```\n\n**Output:** The length of the LCS is 4\n", "/solutions/longest-common-subsequence.md"));</script>
